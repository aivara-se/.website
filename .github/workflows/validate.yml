name: validate

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Formatting
        run: bun run format:check

      - name: Build
        run: bun run build

  # The organisation's entry file, checked against the one standard in
  # aivara-se/.github. This repository carries no copy of the checker.
  agents:
    uses: aivara-se/.github/.github/workflows/validate-agents.yml@main
